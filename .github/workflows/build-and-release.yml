name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe-name: sy-ftp.exe

          - os: ubuntu-latest
            rid: linux-x64
            exe-name: sy-ftp

          - os: macos-13
            rid: osx-x64
            exe-name: sy-ftp

          - os: macos-latest
            rid: osx-arm64
            exe-name: sy-ftp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: >
          dotnet publish
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --no-restore

      - name: Rename publish folder
        shell: bash
        run: |
          mv ./bin/Release/net10.0/${{ matrix.rid }}/publish ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sy-ftp-${{ matrix.rid }}
          path: ./publish

  create-windows-installer:
    name: Windows Installer
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: sy-ftp-win-x64
          path: ./publish

      - name: Install Inno Setup
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://jrsoftware.org/download.php/is.exe" `
            -OutFile "C:\is.exe"

          Start-Process `
            -FilePath "C:\is.exe" `
            -ArgumentList "/VERYSILENT" `
            -Wait

      - name: Create Inno Script
        shell: powershell
        run: |
          @"
          [Setup]
          AppName=SY-FTP
          AppVersion=${{ github.ref_name }}
          AppPublisher=ygq-future
          AppURL=https://github.com/ygq-future/sy-ftp
          DefaultDirName={pf}\SY-FTP
          DefaultGroupName=SY-FTP
          OutputDir=.
          OutputBaseFilename=sy-ftp-installer
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern

          [Files]
          Source: "publish\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs

          [Icons]
          Name: "{group}\SY-FTP"; Filename: "{app}\sy-ftp.exe"
          Name: "{commondesktop}\SY-FTP"; Filename: "{app}\sy-ftp.exe"

          [Run]
          Filename: "{app}\sy-ftp.exe"; Description: "Launch SY-FTP"; Flags: nowait postinstall skipifsilent
          "@ | Out-File setup.iss -Encoding utf8

      - name: Build Installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Upload Installer
        uses: softprops/action-gh-release@v2
        with:
          files: sy-ftp-installer.exe

  create-macos-app:
    name: macOS App Bundle
    runs-on: macos-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download ARM64 Build
        uses: actions/download-artifact@v4
        with:
          name: sy-ftp-osx-arm64
          path: ./arm64

      - name: Download x64 Build
        uses: actions/download-artifact@v4
        with:
          name: sy-ftp-osx-x64
          path: ./x64

      - name: Create Universal Binary
        shell: bash
        run: |
          lipo -create \
            ./arm64/sy-ftp \
            ./x64/sy-ftp \
            -output ./sy-ftp

          chmod +x ./sy-ftp

      - name: Create App Bundle
        shell: bash
        run: |
          mkdir -p SY-FTP.app/Contents/MacOS
          mkdir -p SY-FTP.app/Contents/Resources

          cp -R ./arm64/* ./SY-FTP.app/Contents/MacOS/

          rm ./SY-FTP.app/Contents/MacOS/sy-ftp

          cp ./sy-ftp ./SY-FTP.app/Contents/MacOS/

          chmod +x ./SY-FTP.app/Contents/MacOS/sy-ftp

          cat > ./SY-FTP.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>sy-ftp</string>

              <key>CFBundleIdentifier</key>
              <string>com.ygqfuture.syftp</string>

              <key>CFBundleName</key>
              <string>SY-FTP</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleVersion</key>
              <string>${{ github.ref_name }}</string>

              <key>CFBundleShortVersionString</key>
              <string>${{ github.ref_name }}</string>

              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Create DMG
        shell: bash
        run: |
          hdiutil create \
            -volname "SY-FTP" \
            -srcfolder ./SY-FTP.app \
            -ov \
            -format UDZO \
            SY-FTP.dmg

      - name: Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          files: SY-FTP.dmg